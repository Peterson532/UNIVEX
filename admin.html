<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex"><title>Painel | UNIVEX</title>
<style>
:root{color-scheme:dark;--bg:#050615;--card:#0e1030;--line:#262a5c;--tx:#e8ebff;--mut:#98a0d8;--ac:#7c5cff}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{position:sticky;top:0;z-index:5;display:flex;gap:12px;align-items:center;padding:12px 20px;background:#080a22;border-bottom:1px solid var(--line)}
header h1{font-size:17px;margin:0;flex:1}main{max-width:900px;margin:0 auto;padding:20px}
input,textarea{width:100%;background:#080a22;color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:9px;font:inherit}
button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:9px 16px;font:inherit;cursor:pointer}button.q{background:#1b1e4d}
#login{max-width:340px;margin:12vh auto;display:grid;gap:10px}
details{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:12px 0;padding:6px 14px}
summary{cursor:pointer;padding:8px 0;font-weight:600}.f{margin:12px 0}.f label{display:block;font-size:12px;color:var(--mut);margin-bottom:4px}
.f.dirty textarea,.f.dirty input{border-color:var(--ac)}img.pv{max-height:70px;border-radius:6px;background:#fff2;margin:4px 0;display:block}
#msg{font-size:13px;color:var(--mut)}.hide{display:none!important}
</style></head><body>
<form id="login"><h1>Painel UNIVEX</h1><input id="em" type="email" placeholder="E-mail" required autocomplete="username"><input id="pw" type="password" placeholder="Senha" required autocomplete="current-password"><button>Entrar</button><span id="msg"></span></form>
<div id="app" class="hide"><header><h1>Painel UNIVEX</h1><span id="st"></span><input id="q" placeholder="Buscar campo..." style="max-width:220px"><button id="save">Salvar alterações</button><button class="q" id="out">Sair</button></header><main id="box"></main></div>
<script>window.CMS_NO_AUTO=true;</script><script src="config.js"></script><script src="cms.js"></script>
<script>
const C=window.UNIVEX_CONFIG||{},U=C.supabaseUrl,K=C.supabaseKey,$=s=>document.querySelector(s);
const PAGES=["index","sobre","servicos","projetos","contato","site-institucional","landing-page","cardapio-digital"];
let token="",data={},items=new Map();
const H=(x={})=>({apikey:K,Authorization:"Bearer "+(token||K),...x});
$("#login").onsubmit=async e=>{e.preventDefault();
  if(!U||!K){$("#msg").textContent="Preencha supabaseUrl e supabaseKey no config.js.";return}
  const r=await fetch(`${U}/auth/v1/token?grant_type=password`,{method:"POST",headers:{apikey:K,"Content-Type":"application/json"},body:JSON.stringify({email:$("#em").value,password:$("#pw").value})});
  const j=await r.json();if(!r.ok){$("#msg").textContent="Login inválido.";return}
  token=j.access_token;$("#login").classList.add("hide");$("#app").classList.remove("hide");init()};
$("#out").onclick=()=>location.reload();
async function init(){
  $("#box").textContent="Carregando páginas...";
  data=await CMS.load();let html="";
  for(const p of PAGES){
    let doc;try{doc=new DOMParser().parseFromString(await (await fetch(p+".html")).text(),"text/html")}catch(e){continue}
    const t=doc.querySelector("title");if(t)add(p+":title",p+" · título da aba",t.textContent,"t");
    CMS.fields(doc,p).forEach(f=>add(f.key,f.el.textContent.trim().slice(0,60),f.el.innerHTML.trim(),"t",p));
    doc.querySelectorAll("img").forEach(i=>{const s=i.getAttribute("src");add("img:"+s,"Imagem "+s,s,"i",p)});
  }
  const groups={};items.forEach((v,k)=>(groups[v.g]??=[]).push([k,v]));
  $("#box").innerHTML="";
  Object.entries(groups).forEach(([g,list])=>{
    const d=document.createElement("details");d.innerHTML=`<summary>${g.startsWith("global")?"Cabeçalho, rodapé e contato (todas as páginas)":g} (${list.length})</summary>`;
    list.forEach(([k,v])=>d.append(field(k,v)));$("#box").append(d)});
}
function add(k,label,def,type,page){if(items.has(k))return;
  items.set(k,{label,def,type,g:k.startsWith("global")?"global":(page||k.split(":")[0]),cur:k in data?data[k]:def})}
function field(k,v){const w=document.createElement("div");w.className="f";w.dataset.k=k;w.dataset.s=(v.label+k).toLowerCase();
  const l=document.createElement("label");l.textContent=v.label+"  ·  "+k;w.append(l);
  if(v.type==="i"){const im=document.createElement("img");im.className="pv";im.src=v.cur;const inp=document.createElement("input");inp.value=v.cur;
    const fi=document.createElement("input");fi.type="file";fi.accept="image/*";
    fi.onchange=async()=>{const f=fi.files[0];if(!f)return;const n=Date.now()+"-"+f.name.replace(/[^\w.-]/g,"_");
      const r=await fetch(`${U}/storage/v1/object/site-images/${n}`,{method:"POST",headers:H({"Content-Type":f.type,"x-upsert":"true"}),body:f});
      if(!r.ok){alert("Falha no envio da imagem.");return}inp.value=`${U}/storage/v1/object/public/site-images/${n}`;im.src=inp.value;mark(w,inp,v)};
    inp.oninput=()=>{im.src=inp.value;mark(w,inp,v)};w.append(im,inp,fi);w._i=inp}
  else{const t=document.createElement("textarea");t.rows=Math.min(6,Math.ceil(v.cur.length/90)+1);t.value=v.cur;t.oninput=()=>mark(w,t,v);w.append(t);w._i=t}
  return w}
const mark=(w,i,v)=>w.classList.toggle("dirty",i.value!==v.cur);
$("#q").oninput=e=>{const s=e.target.value.toLowerCase();document.querySelectorAll(".f").forEach(f=>f.classList.toggle("hide",!!s&&!f.dataset.s.includes(s)));if(s)document.querySelectorAll("details").forEach(d=>d.open=true)};
$("#save").onclick=async()=>{
  const rows=[...document.querySelectorAll(".f.dirty")].map(w=>({key:w.dataset.k,value:w._i.value}));
  if(!rows.length){$("#st").textContent="Nada a salvar.";return}
  const r=await fetch(`${U}/rest/v1/site_content?on_conflict=key`,{method:"POST",headers:H({"Content-Type":"application/json",Prefer:"resolution=merge-duplicates"}),body:JSON.stringify(rows)});
  if(!r.ok){$("#st").textContent="Erro ao salvar (confira o login e o SQL).";return}
  rows.forEach(x=>items.get(x.key).cur=x.value);document.querySelectorAll(".f.dirty").forEach(w=>w.classList.remove("dirty"));
  $("#st").textContent=`${rows.length} alteração(ões) salva(s).`};
</script></body></html>
